[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labvla"
version = "0.1.0"
description = "Language-conditioned lab robotics simulation with VLM planning, MuJoCo control, and a lightweight world model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
sim = [
  "mujoco>=3.0",
  "robosuite>=1.4",
]
torch = [
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["labvla*"]
