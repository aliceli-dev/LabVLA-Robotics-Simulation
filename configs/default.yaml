instructions:
  - "Move the red test tube to rack B"
  - "Move the blue test tube to rack A"
vlm_backend: mock
controller: scripted
world_model:
  state_dim: 8
  action_dim: 4
  hidden_dim: 64
env:
  robot: panda
  objects:
    - red_tube
    - blue_tube
  racks:
    - rack_a
    - rack_b
demo:
  seed: 0
  save_trajectory: true
  steps_per_segment: 5
  output_dir: outputs
